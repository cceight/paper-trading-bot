<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ペーパートレード成績</title>
<style>
:root{
  --bg:#f7f6f3; --surface:#ffffff; --ink:#1c1b19; --ink2:#55524c; --muted:#8a867e;
  --line:#e4e1da; --grid:#eeece7; --accent:#2f6fdb; --accent-soft:rgba(47,111,219,.08);
  --bench:#c26a0e; --up:#1e7a4d; --down:#b4372c; --base:#a39f96;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141413; --surface:#1d1c1a; --ink:#ecebe7; --ink2:#b7b3aa; --muted:#878379;
    --line:#2e2c29; --grid:#262522; --accent:#5b8fe8; --accent-soft:rgba(91,143,232,.12);
    --bench:#c97a24; --up:#5cc08e; --down:#ec7d72; --base:#6b675f;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;line-height:1.6}
main{max-width:960px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:0 0 22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:500;color:var(--ink2)}
.up{color:var(--up)} .down{color:var(--down)}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 10px}
.chart-wrap{position:relative}
svg{display:block;width:100%;height:280px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);
  white-space:nowrap;display:none;font-variant-numeric:tabular-nums}
.legend{font-size:12px;color:var(--ink2);display:flex;gap:16px;margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.tip .row{display:flex;gap:10px;justify-content:space-between}
.tip .sw{display:inline-block;width:10px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.explain{font-size:12px;color:var(--ink2);margin:10px 0 0}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
#positions,#pending{overflow-x:auto}
th{color:var(--muted);font-weight:500;font-size:12px}
td.n,th.n{text-align:right}
.scroll{max-height:360px;overflow:auto}
.empty{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:12px;margin-top:20px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <h1>ペーパートレード成績</h1>
  <p class="sub" id="sub">読み込み中…</p>

  <div class="tiles" id="tiles"></div>

  <section>
    <h2>資産の推移</h2>
    <div class="chart-wrap">
      <svg id="chart" role="img" aria-label="資産の推移グラフ"></svg>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend">
      <span><i style="border-color:var(--accent)"></i>実際の成績</span>
      <span><i style="border-color:var(--accent);border-top-style:dashed"></i>コストを払う前</span>
      <span><i style="border-color:var(--bench)"></i><span id="lg-bench">SPY</span>を買って放置</span>
      <span><i style="border-color:var(--base);border-top-width:1px;border-top-style:dotted"></i>開始資金</span>
    </div>
    <p class="explain">実線と点線の差が「手数料と価格ズレに消えた分」、点線とオレンジの差が「売買ルールの実力」です。点線がオレンジより下なら、コスト以前にルールが放置に負けています。</p>
  </section>

  <section>
    <h2>保有中</h2>
    <div id="positions"></div>
  </section>

  <section>
    <h2>次の足で約定予定の注文</h2>
    <div id="pending"></div>
  </section>

  <section>
    <h2>約定履歴 <span class="sub" style="font-size:12px">(新しい順・最大300件)</span></h2>
    <div class="scroll" id="trades"></div>
  </section>

  <p class="note">お金は動いていない仮想の成績です。約定は「判断した足の次の5分足の始値」に、価格ズレと手数料を差し引いて計算しています。時刻は日本時間。</p>
</main>

<script>
const $ = id => document.getElementById(id);
const usd = v => v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const jst = iso => {
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
};
const sideJa = s => s==="BUY" ? "買い" : "売り";

async function load(path, fallback){
  try{ const r = await fetch(path,{cache:"no-store"}); if(!r.ok) throw 0; return await r.json(); }
  catch{ return fallback; }
}

const tone = v => v > 0 ? "up" : v < 0 ? "down" : "";
const signed = (v, f) => `${v > 0 ? "+" : v < 0 ? "−" : ""}${f(Math.abs(v))}`;

function tiles(s){
  const bench = s.benchmark || "SPY";
  const vs = s.vs_bench ?? 0;
  const items = [
    ["総資産", `${usd(s.equity)} <small>USD</small>`],
    ["損益率", `<span class="${tone(s.return_pct)}">${signed(s.return_pct, v=>v.toFixed(2))}%</span>`],
    [`${bench}放置との差`, `<span class="${tone(vs)}">${signed(vs, usd)}</span> <small>USD</small>`],
    ["コストで失った額", `${usd(s.costs_paid ?? s.fees_paid)} <small>USD</small>`],
    ["約定回数", `${s.trade_count} <small>回</small>`],
    ["現金", `${usd(s.cash)} <small>USD</small>`],
  ];
  $("tiles").innerHTML = items.map(([k,v])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}

function table(el, rows, cols, emptyText){
  if(!rows.length){ el.innerHTML = `<p class="empty">${emptyText}</p>`; return; }
  el.innerHTML = `<table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${c.h}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function chart(points, base, benchName){
  const svg = $("chart"), tip = $("tip");
  const W = svg.clientWidth || 800, H = 280, L = 56, R = 74, T = 12, B = 28;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  if(points.length < 2){
    svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--muted)" font-size="13">まだデータが足りません(市場が開くと15分おきに増えていきます)</text>`;
    return;
  }
  // 時間の飛び(夜・週末)を詰めるため、x軸は「足の番号」で取る
  // 古い形式([ts, 資産])でも動くように、無い列は実際の資産・開始資金で埋める
  points = points.map(p => [p[0], p[1], p[2] ?? p[1], p[3] ?? base]);
  const series = [
    {k:1, name:"実際", color:"var(--accent)", dash:""},
    {k:2, name:"コスト前", color:"var(--accent)", dash:"5 4"},
    {k:3, name:`${benchName}放置`, color:"var(--bench)", dash:""},
  ];
  const ys = points.flatMap(p=>[p[1],p[2],p[3]]).concat([base]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = (hi-lo)*0.08 || base*0.005; lo -= pad; hi += pad;
  const x = i => L + (W-L-R) * i/(points.length-1);
  const y = v => T + (H-T-B) * (1-(v-lo)/(hi-lo));

  let g = "";
  for(let k=0;k<=4;k++){
    const v = lo + (hi-lo)*k/4, yy = y(v);
    g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/>`;
    g += `<text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v).toLocaleString()}</text>`;
  }
  // 日付ラベル(日が変わる所)
  // 日が変わる所にラベル。近すぎるときは新しい日の方を残す
  let lastDay = "";
  const dayLabels = [];
  points.forEach((p,i)=>{
    const day = new Date(p[0]).toLocaleDateString("ja-JP",{timeZone:"America/New_York",month:"numeric",day:"numeric"});
    if(day===lastDay) return;
    lastDay = day;
    const lbl = {x:x(i), day};
    if(dayLabels.length && lbl.x - dayLabels[dayLabels.length-1].x < 48) dayLabels[dayLabels.length-1] = lbl;
    else dayLabels.push(lbl);
  });
  dayLabels.forEach(l => { g += `<text x="${l.x}" y="${H-8}" font-size="11" fill="var(--muted)">${l.day}</text>`; });
  const by = y(base);
  g += `<line x1="${L}" x2="${W-R}" y1="${by}" y2="${by}" stroke="var(--base)" stroke-width="1" stroke-dasharray="1 3"/>`;
  const path = k => points.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
  const d1 = path(1);
  g += `<path d="${d1} L${x(points.length-1)},${H-B} L${L},${H-B}Z" fill="var(--accent-soft)"/>`;
  // 奥から: SPY放置 → コスト前(点線) → 実際
  [series[2], series[1], series[0]].forEach(s => {
    g += `<path d="${path(s.k)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"${s.dash?` stroke-dasharray="${s.dash}"`:""}/>`;
  });
  // 線の右端にラベル(重ならないよう上下にずらす)
  const last = points[points.length-1];
  const ends = series.map(s => ({...s, y: y(last[s.k])})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++) if(ends[i].y - ends[i-1].y < 14) ends[i].y = ends[i-1].y + 14;
  const over = ends[ends.length-1].y - (H-B);
  if(over > 0) ends.forEach(e => e.y -= over);
  ends.forEach(e => {
    g += `<text x="${W-R+6}" y="${e.y+4}" font-size="11" fill="var(--ink2)">${e.name}</text>`;
  });
  g += `<line id="cross" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  series.forEach(s => {
    g += `<circle class="dot" data-k="${s.k}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  });
  g += `<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="hit"/>`;
  svg.innerHTML = g;

  const cross = svg.querySelector("#cross"), dots = [...svg.querySelectorAll(".dot")];
  const move = ev => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * W / rect.width;
    const i = Math.max(0, Math.min(points.length-1, Math.round((px-L)/(W-L-R)*(points.length-1))));
    const p = points[i];
    cross.setAttribute("x1",x(i)); cross.setAttribute("x2",x(i)); cross.setAttribute("visibility","visible");
    dots.forEach(dot => {
      dot.setAttribute("cx",x(i)); dot.setAttribute("cy",y(p[+dot.dataset.k])); dot.setAttribute("visibility","visible");
    });
    const row = s => {
      const v = p[s.k], diff = (v/base-1)*100;
      const sw = `<span class="sw" style="border-color:${s.color};${s.dash?'border-top-style:dashed':''}"></span>`;
      return `<div class="row"><span>${sw}${s.name}</span><span><b>${usd(v)}</b> <span class="${tone(diff)}">${signed(diff,v=>v.toFixed(2))}%</span></span></div>`;
    };
    tip.innerHTML = `${jst(p[0])}${series.map(row).join("")}`;
    tip.style.display = "block";
    const left = x(i) * rect.width / W;
    tip.style.left = Math.min(rect.width - tip.offsetWidth, Math.max(0, left - tip.offsetWidth/2)) + "px";
    tip.style.top = "0px";
  };
  const leave = () => {
    tip.style.display="none"; cross.setAttribute("visibility","hidden");
    dots.forEach(dot => dot.setAttribute("visibility","hidden"));
  };
  const hit = svg.querySelector("#hit");
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerleave", leave);
}

(async () => {
  const s = await load("data/summary.json", null);
  if(!s){ $("sub").textContent = "まだ一度も実行されていません。GitHub の Actions から手動実行してみてください。"; return; }
  const eq = await load("data/equity.json", []);
  const tr = await load("data/trades.json", []);

  $("sub").innerHTML = `運用開始 ${jst(s.started_at)} ・ 最終更新 ${jst(s.updated_at)} ・ ルール <span class="tag">${s.strategy.name} ${s.strategy.fast}/${s.strategy.slow}</span>`;
  tiles(s);
  const benchName = s.benchmark || "SPY";
  $("lg-bench").textContent = benchName;
  chart(eq, s.starting_cash, benchName);
  window.addEventListener("resize", () => chart(eq, s.starting_cash, benchName));

  table($("positions"), s.positions, [
    {h:"銘柄", f:r=>r.symbol},
    {h:"株数", n:1, f:r=>r.qty},
    {h:"直近価格", n:1, f:r=>usd(r.price)},
    {h:"評価額", n:1, f:r=>usd(r.value)},
  ], "いまは何も持っていません(全額現金)");

  table($("pending"), s.pending, [
    {h:"銘柄", f:r=>r.symbol},
    {h:"売買", f:r=>sideJa(r.side)},
    {h:"株数", n:1, f:r=>r.qty},
    {h:"判断した時刻", f:r=>jst(r.decided_at)},
  ], "予定の注文はありません");

  table($("trades"), tr.slice().reverse(), [
    {h:"約定時刻", f:r=>jst(r.ts)},
    {h:"銘柄", f:r=>r.symbol},
    {h:"売買", f:r=>`<span class="${r.side==='BUY'?'up':'down'}">${sideJa(r.side)}</span>`},
    {h:"株数", n:1, f:r=>r.qty},
    {h:"価格", n:1, f:r=>usd(+r.price)},
    {h:"手数料", n:1, f:r=>usd(+r.fee)},
  ], "まだ約定はありません");
})();
</script>
</body>
</html>
