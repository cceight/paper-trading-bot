# paper-trade: 米国市場の時間帯に15分おきに起動
name: paper-trade

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        run: python -m bot.run

      - name: Save results
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "paper-trade-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "trade: $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push; then
            echo "::warning::別の実行と保存がぶつかったため今回の保存は見送りました(次の回で同じ結果が作り直されます)"
          fi
